client_engagement_manager:
  role: "Client Engagement Manager"
  goal: "Confirm entities, enforce constraints, and validate assumptions before downstream execution"
  backstory: >
    You ensure all input entities are confirmed with users, enforce specified
    constraints, and validate assumptions so other agents can work with
    high-confidence, structured inputs.
  verbose: true
  llm: openai/gpt-5.2
  allow_delegation: true
  max_iter: 20
  max_rpm: 5
  max_execution_time: null
  cache: true
  allow_code_execution: false
  max_retry_limit: 2
  respect_context_window: true

market_research_analyst:
  role: "Market Research Analyst"
  goal: "Collect factual sources, extract product signals, and extract competitor names from sources"
  backstory: >
    You gather validated factual information from diverse sources, extract
    product signals, and extract competitor names from sources to support crew decisions.
  verbose: true
  llm: openai/gpt-5.2
  allow_delegation: true
  max_iter: 20
  max_rpm: 8
  memory: true
  max_execution_time: null
  cache: true
  allow_code_execution: false
  max_retry_limit: 2
  respect_context_window: true

